<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="link-jump：长链接与短链接跳转工具">
<title>link-jump · 正在跳转</title>
<script>
  (function () { var h = new Date().getHours(); document.documentElement.classList.toggle('dark', h >= 19 || h < 7); })();
</script>
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="page-jump">
<main class="jump-wrap">

  <!-- 短链配置加载状态 -->
  <section id="loading" class="loading" hidden>
    <p class="loading-text">正在读取短链配置…</p>
  </section>

  <!-- 跳转主体 -->
  <section id="jump" class="jump" hidden>
    <p class="tip">正在前往</p>
    <p class="target" id="targetText"></p>

    <div id="riskBox" class="risk" hidden>
      <p>即将跳转至外部第三方网站，本站不对目标网站的内容安全与真实性做任何担保，请自行甄别风险后再决定是否继续访问。</p>
    </div>

    <p class="countdown"><span id="countNum">5</span> 秒后自动跳转</p>
    <button id="jumpBtn" class="btn" type="button">立即跳转</button>
  </section>

</main>
<script src="assets/js/main.js"></script>
</body>
</html>
